<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevTrack</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header><div><span class="eyebrow">PRODUCTIVITY</span><h1>DevTrack</h1><p>Organize tarefas de desenvolvimento em um Kanban simples.</p></div><button id="newTask">+ Nova tarefa</button></header>
<section class="toolbar"><input id="search" placeholder="Buscar tarefa..."><select id="priority"><option value="">Todas as prioridades</option><option>Alta</option><option>Média</option><option>Baixa</option></select><button id="reset">Restaurar exemplo</button></section>
<main id="board" class="board"></main>
<dialog id="modal"><form id="taskForm" method="dialog"><input type="hidden" id="taskId"><h2 id="formTitle">Nova tarefa</h2><label>Título<input id="title" required maxlength="80"></label><label>Descrição<textarea id="description" maxlength="240"></textarea></label><label>Prioridade<select id="taskPriority"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></label><label>Status<select id="status"><option value="todo">To Do</option><option value="doing">Doing</option><option value="done">Done</option></select></label><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Salvar</button></div></form></dialog>
<script src="assets/app.js"></script></body></html>
